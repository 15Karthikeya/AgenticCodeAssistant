[project]
name = "agentic-code-assistant"
version = "0.1.0"
description = "ReAct agent (LangGraph) with ChromaDB RAG that answers questions about any codebase."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "chromadb>=1.0",
    "python-dotenv>=1.0",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "typer>=0.16",
    "rich>=14.0",
    "tiktoken>=0.9",
]

[project.scripts]
aca = "agentic_code_assistant.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_code_assistant"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "deepeval>=4.2",
]

[tool.pytest.ini_options]
# Plain `pytest` runs only the free, offline unit tests.
# The LLM-graded evals live in tests/evals and run via `deepeval test run` (see README).
testpaths = ["tests/unit"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
